<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>PotatoNet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <div class="brand">
            <img class="brand-logo" src="potatonet.webp" alt="">
            <span>PotatoNet</span>
        </div>
        <div id="status" class="status">Запуск...</div>
        <button id="optsBtn" class="ghost">Опции</button>
    </header>

    <main class="content">
        <div class="toolbar">
            <button id="addBtn">+ Добавить сеть</button>
        </div>
        <div id="empty" class="empty hidden">
            У вас пока нет сетей.<br>
            Нажмите «Добавить сеть», введите имя и пароль — и позовите друзей в ту же сеть.
        </div>
        <div id="networks"></div>
    </main>

    <dialog id="netDialog">
        <form method="dialog" class="dialog-form">
            <h3 id="dialogTitle">Новая сеть</h3>
            <label>Имя сети</label>
            <input id="f-name" type="text" placeholder="например, home" autocomplete="off">
            <label>Пароль</label>
            <input id="f-secret" type="password" placeholder="пароль сети" autocomplete="off">
            <label>Имя устройства <span class="hint-inline">(как вас видят другие, можно оставить пустым)</span></label>
            <input id="f-hostname" type="text" placeholder="например, my-laptop" autocomplete="off">
            <div class="dialog-actions">
                <button value="cancel" class="ghost" formnovalidate>Отмена</button>
                <button value="save" id="dialogSave">Сохранить</button>
            </div>
        </form>
    </dialog>

    <dialog id="optsDialog">
        <form method="dialog" class="dialog-form">
            <h3>Опции</h3>
            <label class="check">
                <input type="checkbox" id="opt-autostart">
                Запускать при входе в систему
            </label>
            <p class="hint">При включении PotatoNet откроется сам после входа в систему — с окном и готовыми сетями.</p>
            <div class="dialog-actions">
                <button value="close" class="ghost" formnovalidate>Закрыть</button>
                <button value="ok" id="optsSave">Сохранить</button>
            </div>
        </form>
    </dialog>

    <script src="app.js"></script>
</body>

</html>
